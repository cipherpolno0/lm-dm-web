  --success:oklch(.5 .14 152);--success-foreground:oklch(.985 0 0);
  --warning:oklch(.8 .15 80);--warning-foreground:oklch(.205 0 0);

*{box-sizing:border-box}
html{background:var(--background)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:16px;line-height:1.7}
#app{display:flex;flex-direction:column;flex:1}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
h1,h2,h3,p,dl,dd{margin:0}
h1{font-size:28px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.4;font-weight:600}
h3{font-size:16px;line-height:1.5;font-weight:600}
a{color:inherit}
.muted{color:var(--muted-foreground)}.small{font-size:14px;line-height:1.6}.xs{font-size:12px;line-height:1.5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.nowrap{white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-80px;z-index:50;background:var(--primary);color:var(--primary-foreground);padding:8px 16px;border-radius:var(--radius)}
.skip:focus{top:12px}
.container{width:100%;max-width:1152px;margin:0 auto;padding:0 16px}
@media (min-width:640px){.container{padding:0 24px}}
.page{padding-top:32px;padding-bottom:64px}
.stack>*+*{margin-top:24px}.stack-sm>*+*{margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.grid{display:grid;gap:16px}
@media (min-width:640px){.g2{grid-template-columns:repeat(2,1fr)}.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}

.banner{background:var(--warning);color:var(--warning-foreground);font-size:13px;line-height:1.5;padding:6px 16px;text-align:center}
.site-header{border-bottom:1px solid var(--border);background:var(--background);position:sticky;top:0;z-index:20}
.site-header .container{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;min-height:56px;padding-top:6px;padding-bottom:6px}
.brand{font-weight:600;text-decoration:none;margin-right:auto;display:inline-flex;align-items:center;min-height:44px}
.nav{display:flex;flex-wrap:wrap;gap:2px;list-style:none;margin:0;padding:0}
.nav a{display:inline-flex;align-items:center;min-height:40px;padding:4px 10px;border-radius:calc(var(--radius) - 2px);font-size:14px;text-decoration:none;color:var(--muted-foreground)}
.nav a:hover,.nav a[aria-current=page]{color:var(--foreground);background:var(--muted)}
.site-footer{border-top:1px solid var(--border);margin-top:auto;padding:24px 0;font-size:13px;color:var(--muted-foreground)}
.hero{border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--muted) 45%,transparent);padding:48px 0}
.hero h1{font-size:30px}@media (min-width:640px){.hero h1{font-size:36px}.hero{padding:64px 0}}

.shell{display:flex;flex:1;flex-direction:column}
.side{border-bottom:1px solid var(--border);background:var(--sidebar);overflow-x:auto}
.side ul{list-style:none;margin:0;padding:8px 12px;display:flex;gap:4px;white-space:nowrap}
.side a{display:inline-flex;align-items:center;min-height:40px;padding:4px 12px;border-radius:calc(var(--radius) - 2px);text-decoration:none;font-size:14px}
.side a:hover{background:var(--muted)}
.side a[aria-current=page]{background:var(--primary);color:var(--primary-foreground);font-weight:500}
.side .role{padding:12px 16px 0;font-size:12px;color:var(--muted-foreground);display:none}
.main{flex:1;min-width:0;padding:24px 16px 64px}
@media (min-width:900px){
  .shell{flex-direction:row}
  .side{width:248px;flex:none;border-bottom:0;border-right:1px solid var(--border)}
  .side ul{flex-direction:column;white-space:normal;padding:8px 12px 16px}
  .side a{display:flex}.side .role{display:block}
  .main{padding:32px 32px 64px}
}

.card{border:1px solid var(--border);background:var(--card);border-radius:calc(var(--radius) + 4px);padding:20px;box-shadow:0 1px 2px rgb(0 0 0 / .04)}
a.card{display:flex;flex-direction:column;text-decoration:none}
a.card:hover{border-color:var(--ring)}
.card h3 a{text-decoration:none}.card h3 a:hover{text-decoration:underline}
.empty{border:1px dashed var(--border);border-radius:var(--radius);padding:32px 16px;text-align:center;color:var(--muted-foreground)}
.alert{border:1px solid var(--border);border-left-width:4px;border-radius:var(--radius);padding:12px 16px;font-size:14px;line-height:1.6;background:var(--card)}
.alert.info{border-left-color:var(--info)}.alert.warn{border-left-color:var(--warning)}.alert.err{border-left-color:var(--destructive)}.alert.ok{border-left-color:var(--success)}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:1px 10px;font-size:12px;line-height:1.6;font-weight:500;border:1px solid transparent;white-space:nowrap;text-decoration:none}
.b-default{background:var(--primary);color:var(--primary-foreground)}
.b-secondary{background:var(--muted);color:var(--foreground)}
.b-outline{border-color:var(--border);color:var(--foreground)}
.b-success{background:var(--success);color:var(--success-foreground)}
.b-warning{background:var(--warning);color:var(--warning-foreground)}
.b-info{background:var(--info);color:var(--info-foreground)}
.b-destructive{background:var(--destructive);color:var(--destructive-foreground)}
a.badge:hover{border-color:var(--ring)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:6px 16px;border-radius:calc(var(--radius) - 2px);
  font:inherit;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--border);background:var(--background);color:var(--foreground)}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn.primary:hover{opacity:.9;background:var(--primary)}
.btn.danger{color:var(--destructive);border-color:var(--destructive)}
.btn.danger.primary{background:var(--destructive);color:var(--destructive-foreground)}
.btn.sm{min-height:32px;padding:2px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:4px 2px;font:inherit;font-size:13px;font-weight:500;color:var(--info);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--destructive)}
a.link{color:var(--info);text-underline-offset:3px}

label.lb{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
input[type=text],input[type=search],input[type=number],input[type=email],input[type=date],select,textarea{
  width:100%;min-height:40px;padding:6px 12px;border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);background:var(--background);color:var(--foreground);font:inherit;font-size:14px}
textarea{min-height:96px;resize:vertical}
input[type=file]{display:block;width:100%;min-height:40px;font:inherit;font-size:14px;color:var(--foreground)}
.help{font-size:12px;line-height:1.5;color:var(--muted-foreground);margin-top:4px}

.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
table.dt{width:100%;border-collapse:collapse;text-align:left;font-size:14px;line-height:1.6}
table.dt th{font-weight:500;color:var(--muted-foreground);padding:10px 12px;white-space:nowrap;border-bottom:1px solid var(--border)}
table.dt td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top}
table.dt tr:first-child td{border-top:0}
table.dt td.num,table.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
table.dt td.act{white-space:nowrap}
table.matrix td,table.matrix th{font-size:12px;padding:6px 8px}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
dl.meta dt{color:var(--muted-foreground)}
.crumbs{font-size:13px;color:var(--muted-foreground)}.crumbs a{color:inherit}

.tree{list-style:none;margin:0;padding:0}
.tree li a{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:8px 12px;text-decoration:none;border-top:1px solid var(--border);font-size:14px}
.tree li:first-child a{border-top:0}.tree li a:hover{background:var(--muted)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tabs a{padding:8px 12px;font-size:14px;text-decoration:none;color:var(--muted-foreground);border-bottom:2px solid transparent;margin-bottom:-1px}

.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;font-size:14px}
.prose{max-width:720px}.prose p+p{margin-top:12px}
ul.reasons{margin:4px 0 0;padding-left:18px;font-size:13px}
ul.reasons li.e{color:var(--destructive)}ul.reasons li.w{color:var(--muted-foreground)}
dialog{border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);background:var(--card);color:var(--foreground);padding:0;width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 32px)}

dialog form{padding:20px}
dialog .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);background:var(--foreground);color:var(--background);
  padding:10px 16px;border-radius:var(--radius);font-size:14px;box-shadow:0 4px 16px rgb(0 0 0 / .25);display:none}
#toast.show{display:block}#toast.err{background:var(--destructive);color:var(--destructive-foreground)}

      if (r === 1 && /^fullname\b/i.test(v.fullName)) continue; // แถวคำอธิบายฟิลด์ใต้หัวตารางของแม่แบบ
      out.push({ rowNumber: r + 1, v });
    }
    if (!out.length) throw new Error("ชีทนำเข้าไม่มีข้อมูลรายการ");

/** คืนวันที่รูปแบบ YYYY-MM-DD, null ถ้าว่าง, undefined ถ้ารูปแบบผิด (รับเลขวันที่ของ Excel ด้วย) */
function parseDay(s) {
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const d = new Date(s + "T00:00:00Z"); return !isNaN(d) && d.toISOString().slice(0, 10) === s ? s : undefined; }
  if (/^\d{5}(\.\d+)?$/.test(s)) { const n = Math.floor(Number(s)); if (n > 20000 && n < 80000) return new Date(Date.UTC(1899, 11, 30) + n * 86400000).toISOString().slice(0, 10); }
  return undefined;
}
function validateImportRows(rawRows, user) {
  const orgByCode = new Map(live("organizations").filter((o) => o.code).map((o) => [o.code.toUpperCase(), o])), posByCode = new Map(live("positions").map((p) => [p.code.toUpperCase(), p])), personByRef = new Map(live("persons").filter((p) => p.referenceCode).map((p) => [p.referenceCode, p]));
  const dupSeen = new Map(), refSeen = new Map(), uniqueClaim = new Map();
  return rawRows.map(({ rowNumber, v }) => {
    const errors = [], warnings = [];
    if (!v.fullName) errors.push("ต้องระบุชื่อ-ฉายา/นามสกุล");
    const org = orgByCode.get(v.organizationCode.toUpperCase()), pos = posByCode.get(v.positionCode.toUpperCase());
    if (!v.organizationCode) errors.push("ต้องระบุรหัสหน่วยงานที่ดำรงตำแหน่ง"); else if (!org) errors.push(`ไม่พบรหัสหน่วยงาน ${v.organizationCode}`);
    else if (!can(user, "IMPORT", "execute", { organizationId: org.id })) errors.push("หน่วยงานอยู่นอกขอบเขตสิทธิ์ของบัญชีนี้");
    if (!v.positionCode) errors.push("ต้องระบุรหัสตำแหน่ง"); else if (!pos) errors.push(`ไม่พบรหัสตำแหน่ง ${v.positionCode}`); else if (!pos.isActive) errors.push("ตำแหน่งนี้ถูกปิดใช้งาน");
    const appOrg = v.appointingOrganizationCode ? orgByCode.get(v.appointingOrganizationCode.toUpperCase()) : null;
    if (v.appointingOrganizationCode && !appOrg) errors.push(`ไม่พบรหัสหน่วยงานผู้ออกคำสั่ง ${v.appointingOrganizationCode}`);
    const start = parseDay(v.startDate), end = parseDay(v.endDate);
    if (start === null) errors.push("ต้องระบุวันที่เริ่มดำรงตำแหน่ง"); else if (start === undefined) errors.push("วันที่เริ่มต้องเป็นรูปแบบ YYYY-MM-DD");
    if (end === undefined) errors.push("วันที่สิ้นสุดต้องเป็นรูปแบบ YYYY-MM-DD"); else if (end && start && end <= start) errors.push("วันที่สิ้นสุดต้องมากกว่าวันที่เริ่ม");
    const status = (v.status || "ACTIVE").toUpperCase();
    if (!APPT_STATUS[status]) errors.push(`สถานะ ${v.status} ไม่อยู่ในค่าที่อนุญาต`);
    if (!errors.length) { // ตรวจความซ้ำภายในไฟล์ — เฉพาะแถวที่ผ่านการตรวจรายฟิลด์แล้ว
      const dupKey = [org.id, pos.id, v.referenceCode, start].join("|"), nameKey = lower(v.prefix) + "|" + lower(v.fullName), claimKey = org.id + "|" + pos.id;
      if (dupSeen.has(dupKey)) errors.push(`ซ้ำกับแถว ${dupSeen.get(dupKey)} ในไฟล์เดียวกัน (หน่วยงาน ตำแหน่ง รหัสอ้างอิง และวันที่เริ่มตรงกัน)`);
      else if (v.referenceCode && refSeen.has(v.referenceCode) && refSeen.get(v.referenceCode).nameKey !== nameKey) errors.push(`รหัสอ้างอิง ${v.referenceCode} ซ้ำกับแถว ${refSeen.get(v.referenceCode).rowNumber} แต่ชื่อไม่ตรงกัน`);
      else if (status === "ACTIVE" && pos.isUniquePerOrganization && uniqueClaim.has(claimKey)) errors.push(`ตำแหน่ง${pos.title}ของหน่วยงานนี้ถูกจับจองโดยแถว ${uniqueClaim.get(claimKey)} ในไฟล์เดียวกันแล้ว`);
      else {
        dupSeen.set(dupKey, rowNumber);
        if (v.referenceCode && !refSeen.has(v.referenceCode)) refSeen.set(v.referenceCode, { nameKey, rowNumber });
        if (status === "ACTIVE" && pos.isUniquePerOrganization) uniqueClaim.set(claimKey, rowNumber);
        const existing = v.referenceCode && personByRef.get(v.referenceCode);
        if (existing && (lower(existing.fullName) !== lower(v.fullName) || lower(existing.prefix) !== lower(v.prefix))) warnings.push(`รหัสอ้างอิงตรงกับ “${existing.fullName}” แต่ชื่อในไฟล์ไม่ตรงกัน — ระบบจะจับคู่กับบุคคลเดิมและไม่เขียนทับชื่อ โปรดตรวจว่าใช้รหัสถูกคน`);
        if (status === "ACTIVE" && pos.isUniquePerOrganization && live("appointments").some((x) => x.organizationId === org.id && x.positionId === pos.id && x.status === "ACTIVE")) warnings.push("ตำแหน่งนี้มีผู้ปฏิบัติหน้าที่อยู่แล้ว — แถวนี้จะล้มเหลวตอนบันทึก เว้นแต่สิ้นสุดการดำรงตำแหน่งเดิมก่อน");
        if (pos.applicableOrgType && pos.applicableOrgType !== org.type) warnings.push(`ตำแหน่ง${pos.title}ออกแบบไว้สำหรับหน่วยงานประเภท${ORG_TYPE[pos.applicableOrgType]}`);
      }
    }
    return { rowNumber, v, errors, warnings, r: errors.length ? null : { orgId: org.id, posId: pos.id, appOrgId: appOrg ? appOrg.id : org.id, start, end, status } };
  });
}
/** บันทึกทีละแถวแบบ atomic: ถ้าแต่งตั้งไม่สำเร็จ บุคคลที่เพิ่งสร้างในแถวนั้นถูกย้อนกลับด้วย */
function commitImport(im, user) {
  const res = { created: 0, matched: 0, failed: 0 }, jobId = uid("import");
  for (const row of im.rows) {
    if (row.errors.length) continue;
    const existing = row.v.referenceCode ? live("persons").find((p) => p.referenceCode === row.v.referenceCode) : null;
    const person = existing || createPerson({ referenceCode: row.v.referenceCode, prefix: row.v.prefix, fullName: row.v.fullName });
    try {
      const appt = createAppointment({ organizationId: row.r.orgId, positionId: row.r.posId, personId: person.id, appointingOrganizationId: row.r.appOrgId, startDate: row.r.start, endDate: row.r.end, status: row.r.status, documentRef: row.v.documentRef, notes: row.v.notes });
      row.outcome = existing ? "MATCHED" : "CREATED"; res[existing ? "matched" : "created"] += 1;
      audit("ImportJobRow", `${jobId}:${row.rowNumber}`, "CREATE", null, { personId: person.id, appointmentId: appt.id, outcome: row.outcome });
    } catch (e) {
      if (!existing) db.persons = db.persons.filter((p) => p.id !== person.id);
      row.outcome = "FAILED"; row.commitError = e.message; res.failed += 1;
    }
  }
  db.import_jobs.unshift({ id: jobId, fileName: im.fileName, actorId: user.id, total: im.rows.length, invalid: im.rows.filter((r) => r.errors.length).length, ...res, createdAt: nowIso() });
  audit("ImportJob", jobId, "CREATE", null, { fileName: im.fileName, ...res });

}

  ui.imp = { fileName, rows: validateImportRows(rawRows, user), result: null }; render();
  const p = $("#import-preview"); if (p) p.scrollIntoView({ block: "start" });
  const bad = ui.imp.rows.filter((r) => r.errors.length).length; toast(`ตรวจสอบ ${ui.imp.rows.length} แถว: ผ่าน ${ui.imp.rows.length - bad} ไม่ผ่าน ${bad}`, bad === ui.imp.rows.length);
}

const forms = {
  async modal(fd) { if (!modalSubmit) return; const err = await modalSubmit(fd); if (typeof err === "string") { $("#modal-err").textContent = err; return; } closeModal(); },
  nav(fd, form) { const s = new URLSearchParams(); for (const [k, v] of fd.entries()) if (typeof v === "string" && norm(v)) s.set(k, norm(v)); const qs = s.toString(); go(form.dataset.base + (qs ? "?" + qs : "")); },
  login(fd) {
    const u = byId("users", fd.get("userId")); if (!u || u.deletedAt) return;
    if (u.status !== "ACTIVE") return toast(`เข้าสู่ระบบไม่ได้: บัญชีนี้อยู่ในสถานะ “${USER_STATUS[u.status][1]}” ให้ผู้ดูแลระบบสูงสุดอนุมัติที่เมนูระบบสมาชิกก่อน`, true);
    session = { userId: u.id }; ui.imp = null; store.set(SESSION_KEY, JSON.stringify(session)); go("/admin"); toast(`เข้าสู่ระบบในฐานะ ${ROLE_LABEL[u.role]}`);
  },
  async importFile(fd) {
    const user = currentUser(), file = fd.get("file"); if (!need(hasAction(user, "IMPORT", "execute"))) return;
    try { startImport(norm(file.name) || "import.xlsx", extractImportRows(await readXlsx(file)), user); } catch (e) { toast(e.message || "อ่านไฟล์ไม่ได้", true); }
  },
  async restore(fd) {
    if (!need(can(currentUser(), "ADMIN", "update"))) return;
    try { const data = JSON.parse(await fd.get("file").text());
      if (!data || data.v !== 1 || !Array.isArray(data.organizations) || !Array.isArray(data.users)) throw new Error("ไฟล์นี้ไม่ใช่ไฟล์สำรองของระบบ");
      confirmBox("กู้คืนจากไฟล์สำรอง", `แทนที่ข้อมูลปัจจุบันด้วยข้อมูลในไฟล์ (${data.organizations.length} หน่วยงาน, ${data.persons.length} บุคคล)`, "กู้คืนข้อมูล", () => { db = Object.assign(freshDb(), data); ui.imp = null; commit("กู้คืนข้อมูลแล้ว"); }, true);
    } catch (e) { toast(e.message || "อ่านไฟล์สำรองไม่ได้", true); }
  },
};
const inputs = { qStatus(el) { ui.qStatus = el.value; render(); }, auditType(el) { ui.auditType = el.value; render(); } };

/* ---------- events + boot ---------- */
document.addEventListener("click", (ev) => {
  const link = ev.target.closest('a[href^="#/"]');
  if (link) { ev.preventDefault(); return go(link.getAttribute("href").slice(1)); }
  const el = ev.target.closest("[data-act]");
  if (el && !el.disabled && acts[el.dataset.act]) { ev.preventDefault(); Promise.resolve(acts[el.dataset.act](el)).catch((e) => toast(e.message || "เกิดข้อผิดพลาด", true)); }
});
document.addEventListener("submit", (ev) => {
  const form = ev.target.closest("form[data-form]"); if (!form) return;
  ev.preventDefault();
  const fn = forms[form.dataset.form]; if (fn) Promise.resolve(fn(new FormData(form), form)).catch((e) => toast(e.message || "เกิดข้อผิดพลาด", true));
});
document.addEventListener("input", (ev) => { const el = ev.target.closest("[data-on]"); if (el && inputs[el.dataset.on]) inputs[el.dataset.on](el); });
$("#modal").addEventListener("close", () => { modalSubmit = null; });
window.addEventListener("hashchange", () => { const full = location.hash.slice(1) || "/"; const cur = route.path + (route.q.toString() ? "?" + route.q.toString() : ""); if (full.startsWith("/") && decodeURIComponent(full) !== decodeURIComponent(cur)) { route = parseRoute(full); render(); } });

load();
route = parseRoute(location.hash.startsWith("#/") ? location.hash.slice(1) : "/");
render();
</script>
</body>
</html>
